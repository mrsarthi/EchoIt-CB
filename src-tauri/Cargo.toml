[package]
name = "echoit"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "echoit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iroh = "1.0.3"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }

# ─── Update checks (Q21) ──────────────────────────────────────────────────
#
# `reqwest` is already in the tree — iroh pulls it in through netwatch, built
# with rustls and serde_json — so declaring it directly adds no new
# compilation, only an honest edge in the dependency graph. Default features
# off so this cannot be what drags in native-tls.
#
# The request lives in Rust rather than the webview on purpose: the CSP
# (`connect-src 'self' ipc: http://ipc.localhost`) would block a frontend
# fetch to github.com, and widening it to allow one would give up the property
# that makes "the app cannot phone home" checkable. Q16 is closed; it stays
# closed.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }

# TLS trust anchors, compiled in rather than asked of the platform.
#
# reqwest's "rustls" feature verifies certificates through
# rustls-platform-verifier, which on Android must be handed JNI references
# before use. It was not, so it panicked on a tokio worker thread:
#
#     thread 'tokio-rt-worker' panicked:
#     Expect rustls-platform-verifier to be initialized
#
# tokio catches a worker panic, so the process survived — but the task died,
# the future never resolved, and the invoke promise never settled. "Check now"
# span forever with no error, which is how it was reported. Desktop was fine.
#
# Initialising the verifier would mean matching jni crate versions across
# dependencies. Bundling Mozilla's roots removes the platform from the path
# entirely, which for one unauthenticated call to a public API is both simpler
# and more predictable.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki-roots = "1.0"
base64 = "0.23.1"
# ─── OS keychain (M2.2.2) ─────────────────────────────────────────────────
#
# `keyring-core` plus per-platform stores, rather than the `keyring`
# aggregator crate: keyring's own docs say applications "should not be linking
# to this library at all" and should link keyring-core and the specific stores
# they want. That also keeps unused platform backends out of the build.
keyring-core = "1"


# `wmi 0.18.4` declares both `windows` and `windows-core` as ">=0.59, <0.63",
# a range spanning semver-incompatible 0.x releases. Tauri pins
# `windows-core 0.61.2` via tao/webview2-com, so cargo satisfies the two
# independently — `windows` unifies down to 0.61.3 while `windows-core`
# resolves to 0.62.2 — and wmi then fails to compile:
#   error[E0277]: `IWbemObjectSink: windows_core::Interface` is not satisfied
#
# wmi reaches us through netwatch, which is a mandatory (unfeatured)
# dependency of iroh, so it cannot be avoided. `cargo update --precise` cannot
# fix it in either direction: netwatch requires `windows ^0.62.2` so it will
# not go down, and tao requires `^0.61` so it will not go up.
#
# The vendored copy changes exactly two version strings to "0.62" and nothing
# else. Remove this the moment wmi tightens its ranges upstream.
[patch.crates-io]
wmi = { path = "vendor/wmi" }


# Tauri v2 ships no Android updater, so the in-place updater is desktop-only.
# Android's half of Q21 is `updates::check_for_update` plus `opener`, which
# work on every platform.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "android")'.dependencies]
# ndk_context is what android-native-keyring-store reads for its JavaVM and
# Context. Nothing in Tauri or wry initialises it -- verified by grep, after a
# comment in this file claiming otherwise crashed the app on launch -- so
# src/android_ctx.rs does, using jni to reach ActivityThread.currentApplication().
ndk-context = "0.1"
jni = "0.21"
# Stores the ciphertext in SharedPreferences under a key held by the Android
# Keystore. Requires `ndk-context` to be initialised. The upstream README says
# Tauri Mobile does that; it does not, and believing it aborted the app on
# every launch. See src/android_ctx.rs.
android-native-keyring-store = "1"
